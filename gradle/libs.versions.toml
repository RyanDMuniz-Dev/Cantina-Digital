[versions]
agp = "9.3.1"
firebaseBom = "34.17.0"
kotlin = "2.4.10"
kotlinxCoroutinesPlayServices = "1.11.0"
ksp = "2.3.2"
coreKtx = "1.19.0"
junit = "4.13.2"
